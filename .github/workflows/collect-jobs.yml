# Collects jobs from every matched board in job_sources (scripts/collect.ts): new jobs added,
# edited ones updated (and re-labelled), vanished ones closed, closed ones deleted after 7 days.
# Each run is logged in the `runs` table (kind "jobs"). A run fails (red) only if every board
# failed to read, which points at a problem on our side rather than one employer's board.
name: Job collection

on:
  schedule:
    - cron: "30 */6 * * *" # 00:30, 06:30, 12:30, 18:30 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: collect-jobs # never two collections at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Collect jobs
        run: npm run collect -- --apply --minutes=100
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
